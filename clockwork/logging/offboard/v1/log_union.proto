syntax = "proto3";

package clockwork.logging.offboard.v1;

import "clockwork/logging/offboard/v1/log_metadata.proto";

// Log union
message LogUnion {
  // Union log entries
  repeated LogPath log_union_entry = 1;

  // Set to true when this metadata was generated by 'make_merge_union'
  bool is_merge_union = 2;
}
